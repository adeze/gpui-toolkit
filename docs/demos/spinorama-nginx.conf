# Include inside the gpui-toolkit.spinorama.org server block.
# Fixed upstream only: this is the browser adapter for the measurement API.
location /api/spinorama/v1/ {
    proxy_pass https://api.spinorama.org/v1/;
    proxy_set_header Host api.spinorama.org;
    proxy_ssl_server_name on;
    proxy_ssl_name api.spinorama.org;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
}
