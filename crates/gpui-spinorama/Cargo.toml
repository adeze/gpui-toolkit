[package]
name = "gpui-spinorama"
version = "0.10.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Spinorama-style speaker measurement showcase (CEA-2034 curves and dispersion)"
publish = false

[lints]
workspace = true

[[bin]]
name = "spinorama-showcase"
path = "src/main.rs"

[dependencies]
gpui = { workspace = true }
gpui-miniapp = { workspace = true }
gpui-px = { workspace = true, features = ["gpui", "gpu-2d", "vello"] }
gpui-ui-kit = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
