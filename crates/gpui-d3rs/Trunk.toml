[build]
target = "index.html"
# The browser demo is the d3rs-showcase example target (examples, not bins, so
# it can use the dev-dependency MiniApp shell without a package cycle).
example = "d3rs-showcase"
# The example's required features; explicit so the demo survives default drift.
features = ["vello-gpui"]

[serve]
addresses = ["127.0.0.1"]
port = 8083
open = true
headers = { "Cross-Origin-Embedder-Policy" = "require-corp", "Cross-Origin-Opener-Policy" = "same-origin" }
